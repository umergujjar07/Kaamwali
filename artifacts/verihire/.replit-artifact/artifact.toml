kind = "web"
previewPath = "/"
title = "VeriHire"
version = "1.0.0"
id = "artifacts/verihire"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21323

[services.development]
run = "pnpm --filter @workspace/verihire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/verihire", "run", "build" ]
publicDir = "artifacts/verihire/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21323"
BASE_PATH = "/"
